[package]
name = "clickhouse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synchronous ClickHouse client with derived row batches and Native TCP transport"

[lib]
bench = false

[dependencies]
clickhouse-macros = { workspace = true }
clickhouse-sys = { workspace = true }
cxx = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
zerocopy = { workspace = true }

[features]
default = []
tracing = ["dep:tracing"]

[lints]
workspace = true

[dev-dependencies]
rcgen = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
criterion = { workspace = true }
serde_bytes = { workspace = true }

[[bench]]
name = "memory_retention_balance"
harness = false

[[bench]]
name = "zero_copy_and_row_batch"
harness = false

[[bench]]
name = "block_columns"
harness = false
